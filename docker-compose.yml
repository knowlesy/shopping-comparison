services:
  scraper-pod:
    build:
      context: ./services/scraper-pod
      dockerfile: Dockerfile
    container_name: uk-grocery-scraper-pod
    environment:
      - PORT=3002
      - NODE_ENV=production
      - SCRAPE_TOKEN=${SCRAPE_TOKEN:-local-dev-scrape-token-shopping-app}
    shm_size: '2gb'
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  store-fetcher:
    build:
      context: ./services/store-fetcher
      dockerfile: Dockerfile
    container_name: uk-grocery-store-fetcher
    environment:
      - PORT=3003
      - PYTHONUNBUFFERED=1
      - FETCHER_TOKEN=${FETCHER_TOKEN:-local-dev-fetcher-token-shopping-app}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_TYPE=${PROXY_TYPE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  logic-api:
    build:
      context: .
      dockerfile: ./services/logic-api/Dockerfile
    container_name: uk-grocery-logic-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SCRAPER_SERVICE_URL=http://scraper-pod:3002/scrape
      - SCRAPE_TOKEN=${SCRAPE_TOKEN:-local-dev-scrape-token-shopping-app}
      - STORE_FETCHER_URL=http://store-fetcher:3003
      - FETCHER_TOKEN=${FETCHER_TOKEN:-local-dev-fetcher-token-shopping-app}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8080}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATA_DIR=/usr/src/app/data/runtime
    volumes:
      - logic-data:/usr/src/app/data/runtime
    depends_on:
      - scraper-pod
      - store-fetcher
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    container_name: uk-grocery-client
    ports:
      - "8080:8080"
    depends_on:
      - logic-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  logic-data:

