services:
  scraper-pod:
    build:
      context: ./services/scraper-pod
      dockerfile: Dockerfile
    container_name: uk-grocery-scraper-pod
    environment:
      - PORT=3002
      - NODE_ENV=production
      - SCRAPE_TOKEN=${SCRAPE_TOKEN:-dev_secret_scrape_token_123}
    shm_size: '2gb'
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  logic-api:
    build:
      context: .
      dockerfile: ./services/logic-api/Dockerfile
    container_name: uk-grocery-logic-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SCRAPER_SERVICE_URL=http://scraper-pod:3002/scrape
      - SCRAPE_TOKEN=${SCRAPE_TOKEN:-dev_secret_scrape_token_123}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - scraper-pod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
