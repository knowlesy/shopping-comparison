# Defensive response headers, in an include rather than only at server level.
#
# nginx's add_header inheritance rule: directives are inherited from the previous
# level ONLY IF the current level declares no add_header of its own. Both `location /`
# (the SPA) and `location /assets/` set Cache-Control, which silently discarded every
# server-level security header on exactly the responses that carry the application.
#
# Including this file in each such location restores them, and keeps one definition.
# Any location that adds a header of its own must include this file too.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;" always;
