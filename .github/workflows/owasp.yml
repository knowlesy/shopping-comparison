name: OWASP Security Audit

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - "TODO.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - "TODO.md"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: OWASP Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install logic-api dependencies
        run: npm --prefix services/logic-api ci

      - name: Install scraper-pod dependencies
        run: npm --prefix services/scraper-pod ci

      - name: Run OWASP Top 10 Security Suite
        run: npm run test:owasp

      - name: Run logic-api security & unit tests
        run: npm test

      - name: Run ESLint security checks
        run: npx eslint services/

      # All four npm scopes. scraper-pod was previously omitted, which is where the
      # puppeteer/extract-zip high-severity chain lived, so the audit reported clean
      # while the highest-severity findings in the repository went unexamined.
      # --audit-level=moderate: the qs chain was moderate and did reach request parsing.
      - name: Run dependency vulnerability audit (Root, Client, Logic-API, Scraper-Pod)
        run: |
          npm audit --audit-level=moderate
          npm --prefix client audit --audit-level=moderate
          npm --prefix services/logic-api audit --audit-level=moderate
          npm --prefix services/scraper-pod audit --audit-level=moderate

      - name: Setup Python 3.12 for Sidecar Security Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Enforced, not reported. This step previously ended in
      #   || echo "Python dependency audit reported findings"
      # which swallowed the exit code, so the job stayed green with 16 known
      # vulnerabilities across curl-cffi and starlette. A failing scanner must fail CI.
      - name: Run Python dependency vulnerability audit (store-fetcher)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r services/store-fetcher/requirements.txt
