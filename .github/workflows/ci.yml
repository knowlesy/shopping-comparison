name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'TODO.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'TODO.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      publish_containers:
        description: 'Build and push Docker containers to GitHub Container Registry'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install logic-api dependencies
        run: npm --prefix services/logic-api ci

      - name: Install scraper-pod dependencies
        run: npm --prefix services/scraper-pod ci

      - name: Lint codebase
        run: npx eslint services/

      - name: Run unit test suite
        run: npm test

      - name: Setup Python 3.12 for store-fetcher
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test store-fetcher sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r services/store-fetcher/requirements.txt
          python -m py_compile services/store-fetcher/*.py services/store-fetcher/adapters/*.py
          pytest services/store-fetcher/tests

      - name: Run verification audit
        run: npm run verify:audit

      - name: Run direct adapters verification
        run: npm run verify:infv

      - name: Build client production bundle
        run: npm run build

  version:
    name: Compute & Derive Version
    needs: test
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute Semantic Version
        id: bump
        run: node scripts/release/auto-version.js

  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      logic-api: ${{ steps.filter.outputs.logic-api }}
      scraper-pod: ${{ steps.filter.outputs.scraper-pod }}
      store-fetcher: ${{ steps.filter.outputs.store-fetcher }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'client/Dockerfile'
            logic-api:
              - 'services/logic-api/**'
              - 'data/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/logic-api/Dockerfile'
            scraper-pod:
              - 'services/scraper-pod/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/scraper-pod/Dockerfile'
            store-fetcher:
              - 'services/store-fetcher/**'
              - 'package.json'
              - 'package-lock.json'
              - 'services/store-fetcher/Dockerfile'

  docker-build:
    name: Build & Publish Container Images
    needs: [test, version, changes]
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_containers == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push client Image
        if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.client == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push logic-api Image
        if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.logic-api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/logic-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version || '1.3.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push scraper-pod Image
        if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.scraper-pod == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/scraper-pod
          file: services/scraper-pod/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push store-fetcher Image
        if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.store-fetcher == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/store-fetcher
          file: services/store-fetcher/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-store-fetcher:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-store-fetcher:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-store-fetcher:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-store-fetcher:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/store-fetcher:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/store-fetcher:v${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/store-fetcher:${{ needs.version.outputs.version || '1.3.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/store-fetcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
