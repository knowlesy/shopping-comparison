name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install logic-api dependencies
        run: npm --prefix services/logic-api ci

      - name: Install scraper-pod dependencies
        run: npm --prefix services/scraper-pod ci

      - name: Lint codebase
        run: npx eslint services/

      - name: Run unit test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build

  docker-build:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push logic-api Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/logic-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push scraper-pod Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/scraper-pod
          file: services/scraper-pod/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
