name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install logic-api dependencies
        run: npm --prefix services/logic-api ci

      - name: Install scraper-pod dependencies
        run: npm --prefix services/scraper-pod ci

      - name: Lint codebase
        run: npx eslint services/

      - name: Run unit test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build

  docker-build:
    name: Verify Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build logic-api Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/logic-api/Dockerfile
          push: false
          tags: trolleywise-logic-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build scraper-pod Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/scraper-pod
          file: services/scraper-pod/Dockerfile
          push: false
          tags: trolleywise-scraper-pod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
