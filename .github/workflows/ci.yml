name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'TODO.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - 'TODO.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      publish_containers:
        description: 'Build and push Docker containers to GitHub Container Registry'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install logic-api dependencies
        run: npm --prefix services/logic-api ci

      - name: Install scraper-pod dependencies
        run: npm --prefix services/scraper-pod ci

      - name: Lint codebase
        run: npx eslint services/

      - name: Run unit test suite
        run: npm test

      - name: Build client production bundle
        run: npm run build

  version:
    name: Compute & Derive Version
    needs: test
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute Semantic Version
        id: bump
        run: node scripts/release/auto-version.js

  docker-build:
    name: Build & Publish Container Images
    needs: [test, version]
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_containers == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push logic-api Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/logic-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-logic-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/logic-api:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version || '1.2.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push scraper-pod Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/scraper-pod
          file: services/scraper-pod/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison-scraper-pod:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:latest
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:v${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:${{ needs.version.outputs.version || '1.2.0' }}
            ghcr.io/${{ github.repository_owner }}/shopping-comparison/scraper-pod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
