apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingwise-logic-api
  namespace: shoppingwise
  labels:
    app: shoppingwise-logic-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingwise-logic-api
  template:
    metadata:
      labels:
        app: shoppingwise-logic-api
    spec:
      containers:
        - name: logic-api
          image: ghcr.io/knowlesy/shopping-comparison-logic-api:3492bc0032a9532c8d53752c2cded006be1558ec
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: PORT_LOGIC
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: NODE_ENV
            - name: SCRAPER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: SCRAPER_SERVICE_URL
            - name: STORE_FETCHER_URL
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: STORE_FETCHER_URL
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: CLIENT_ORIGIN
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: ALLOWED_ORIGINS
            - name: ALLOW_PRIVATE_NETWORK_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: ALLOW_PRIVATE_NETWORK_ORIGINS
            - name: SCRAPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shoppingwise-secret
                  key: SCRAPE_TOKEN
            # Must be the same value the store-fetcher Deployment reads, or the
            # sidecar rejects every direct-adapter request. Neither side may be
            # optional: a one-sided default silently breaks the direct tier.
            - name: FETCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shoppingwise-secret
                  key: FETCHER_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shoppingwise-secret
                  key: GEMINI_API_KEY
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: DATA_DIR
            - name: ENABLE_MATCH_LOG
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: ENABLE_MATCH_LOG
          volumeMounts:
            - name: logic-api-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: logic-api-data
          persistentVolumeClaim:
            claimName: shoppingwise-logic-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingwise-logic-api
  namespace: shoppingwise
spec:
  selector:
    app: shoppingwise-logic-api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shoppingwise-logic-api-data
  namespace: shoppingwise
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
