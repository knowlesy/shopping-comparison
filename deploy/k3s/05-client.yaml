apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingwise-client
  namespace: shoppingwise
  labels:
    app: shoppingwise-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingwise-client
  template:
    metadata:
      labels:
        app: shoppingwise-client
    spec:
      containers:
        - name: client
          image: ghcr.io/knowlesy/shopping-comparison-client:3492bc0032a9532c8d53752c2cded006be1558ec
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Without this the image would fall back to the Compose service name
            # "logic-api", which does not resolve in this namespace, and every
            # /api/ request from the browser would 502.
            - name: LOGIC_API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: LOGIC_API_UPSTREAM
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingwise-client
  namespace: shoppingwise
spec:
  selector:
    app: shoppingwise-client
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
