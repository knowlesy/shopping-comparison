apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingwise-client
  namespace: shoppingwise
  labels:
    app: shoppingwise-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingwise-client
  template:
    metadata:
      labels:
        app: shoppingwise-client
    spec:
      containers:
        - name: client
          image: ghcr.io/knowlesy/shopping-comparison-client:52b0889fb76726475ee06e92dac01748b92542fa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingwise-client
  namespace: shoppingwise
spec:
  selector:
    app: shoppingwise-client
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
