apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingwise-store-fetcher
  namespace: shoppingwise
  labels:
    app: shoppingwise-store-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingwise-store-fetcher
  template:
    metadata:
      labels:
        app: shoppingwise-store-fetcher
    spec:
      containers:
        - name: store-fetcher
          image: ghcr.io/knowlesy/shopping-comparison-store-fetcher:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shoppingwise-config
                  key: PORT_FETCHER
            - name: FETCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shoppingwise-secret
                  key: FETCHER_TOKEN
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingwise-store-fetcher
  namespace: shoppingwise
spec:
  selector:
    app: shoppingwise-store-fetcher
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
      name: http
