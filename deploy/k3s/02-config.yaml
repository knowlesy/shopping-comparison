apiVersion: v1
kind: ConfigMap
metadata:
  name: shoppingwise-config
  namespace: shoppingwise
data:
  NODE_ENV: "production"
  PORT_LOGIC: "3001"
  PORT_SCRAPER: "3002"
  PORT_FETCHER: "3003"
  PORT_CLIENT: "8080"
  SCRAPER_SERVICE_URL: "http://shoppingwise-scraper-pod:3002/scrape"
  STORE_FETCHER_URL: "http://shoppingwise-store-fetcher:3003"
  # Upstream the client's nginx proxies /api/ to. Must match the logic-api Service
  # name in this namespace; the container default (logic-api:3001) is the Compose name.
  LOGIC_API_UPSTREAM: "shoppingwise-logic-api:3001"
  # The browser reaches the API same-origin through the client's nginx, so this is the
  # address households actually type. Loopback and private-network origins are accepted
  # by default; list any others here, comma separated.
  CLIENT_ORIGIN: "http://localhost:8080"
  ALLOWED_ORIGINS: ""
  ALLOW_PRIVATE_NETWORK_ORIGINS: "true"
  DATA_DIR: "/data"
  ENABLE_MATCH_LOG: "false"
